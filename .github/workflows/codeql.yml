name: CodeQL Security Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run at 4 AM UTC every Monday
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Minimal permissions for security
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest

    permissions:
      actions: read        # Read workflow artifacts
      contents: read       # Read repository contents
      security-events: write  # Upload SARIF results

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
      with:
        languages: ${{ matrix.language }}
        # Additional queries to run (optional - adds more security checks)
        queries: +security-extended,security-and-quality

    # Autobuild attempts to build any compiled languages (C/C++/C#/Go/Java/Swift)
    # For Python, this is not needed but we include it for future-proofing
    - name: Autobuild
      uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
      with:
        category: "/language:${{ matrix.language }}"
